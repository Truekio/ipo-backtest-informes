 DATA.runs.map(r=>{const s=r.summary;return [r.name,(s.start||"").slice(0,4)+"–"+(s.end||"").slice(0,4),s.n_trades,

table("params",["Parámetro"].concat(DATA.runs.map(r=>r.name)),keys.length?keys.map(k=>["<code>"+k+"</code>"].concat(DATA.runs.map(r=>(r.meta.overrides||{})[k]??"(config)")))
